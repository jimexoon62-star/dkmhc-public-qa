name: Public QA and read-only site smoke

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '19 8 * * *'

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent synthetic tests
        run: npm test
      - name: Public content disclosure guard
        run: npm run audit:public
      - name: Anonymous public page smoke check (GET only)
        run: npm run check:public-site
